services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelog}
      POSTGRES_USER: ${POSTGRES_USER:-homelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homelog_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - homelog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homelog_postgres_data:

